services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: usm
      POSTGRES_USER: usm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Chisinau
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usm -d usm"]
      interval: 10s
      timeout: 5s
      retries: 8
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Europe/Chisinau
      DATABASE_URL: postgres://usm:${POSTGRES_PASSWORD}@db:5432/usm
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      BOT_TOKEN: ${BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      MINI_APP_URL: ${MINI_APP_URL}
      TRANZY_API_KEY: ${TRANZY_API_KEY}
      TRANZY_VEHICLES_URL: ${TRANZY_VEHICLES_URL}
      WEB_ORIGIN: ${MINI_APP_URL}
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on: [api]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
