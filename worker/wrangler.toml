name = "usm-life"
main = "src/index.ts"
compatibility_date = "2026-10-06"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "../apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "usm-life"
database_id = "19350568-a9eb-46b9-8bbe-c407355f0467"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
ADMIN_USER_IDS = "8624922366"
TZ = "Europe/Chisinau"
TRANZY_VEHICLES_URL = "https://api.tranzy.ai/v1/opendata/vehicles"
TRANZY_REFRESH_MINUTES = "5"
# TRANZY_AGENCY_ID = ""
